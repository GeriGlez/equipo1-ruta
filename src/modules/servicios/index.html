<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUTA · Selección de Módulo</title>
  <link rel="stylesheet" href="../../styles/main.css">
  <link rel="stylesheet" href="./modulos.css">
</head>
<body>

  <div id="app">
    <!-- Header RUTA -->
    <header class="header-ruta">
      <div class="brand-ruta">
        <div class="logo-icon-ruta">
          <svg width="38" height="38" viewBox="0 0 100 100" fill="none">
            <path d="M50 5 L85 25 L85 75 L50 95 L15 75 L15 25 Z" fill="#00A859"/>
            <path d="M50 15 L75 30 L75 70 L50 85 L25 70 L25 30 Z" fill="#FFB800"/>
            <circle cx="50" cy="50" r="18" fill="#005C7A"/>
          </svg>
        </div>
        <div class="brand-text-ruta">
          <div class="brand-title">RUTA</div>
          <div class="brand-subtitle">Gestión de servicios en campo</div>
        </div>
      </div>
      <div class="user-profile-ruta">
        <div class="avatar-circle">
          <span style="font-size: 1.2rem;">👤</span>
        </div>
        <div class="user-info">
          <span class="user-name">Usuario</span>
          <span class="user-role">Administrador</span>
        </div>
      </div>
    </header>

    <!-- Subheader Volver -->
    <div class="sub-header-bar">
      <button id="btn-volver-login" class="btn-back-ruta">← Volver</button>
    </div>

    <!-- Contenido Principal -->
    <main class="modulos-main">
      <h1 class="modulos-title">Selecciona un módulo</h1>

      <div class="modulos-grid">
        <!-- Tarjeta 1: Servicios -->
        <div class="modulo-card" id="card-servicios">
          <div class="icon-circle icon-yellow">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              <line x1="9" y1="10" x2="15" y2="10"></line>
              <line x1="9" y1="14" x2="15" y2="14"></line>
              <line x1="9" y1="18" x2="13" y2="18"></line>
            </svg>
          </div>
          <h2 class="modulo-card-title">Servicios</h2>
          <p class="modulo-card-desc">Observa, edita y crea servicios.</p>
        </div>

        <!-- Tarjeta 2: Contratos -->
        <div class="modulo-card" id="card-contratos">
          <div class="icon-circle icon-blue">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
              <line x1="9" y1="6" x2="9" y2="6.01"></line>
              <line x1="15" y1="6" x2="15" y2="6.01"></line>
              <line x1="9" y1="10" x2="9" y2="10.01"></line>
              <line x1="15" y1="10" x2="15" y2="10.01"></line>
              <line x1="9" y1="14" x2="9" y2="14.01"></line>
              <line x1="15" y1="14" x2="15" y2="14.01"></line>
              <line x1="9" y1="18" x2="15" y2="18"></line>
            </svg>
          </div>
          <h2 class="modulo-card-title">Contratos</h2>
          <p class="modulo-card-desc">Observa, edita y crea servicios.</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="./modulos.js"></script>
</body>
</html>
