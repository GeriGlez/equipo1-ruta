<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUTA · Servicios</title>
  <link rel="stylesheet" href="../../styles/main.css">
  <link rel="stylesheet" href="./servicios.css">
</head>
<body>

  <div id="app">
    <!-- ==================================================
        ENCABEZADO UNIFICADO
    =================================================== -->
    <header class="visitas-header">
      <div class="visitas-brand">
        <img
          src="/logo-ruta.png"
          alt="RUTA"
          class="visitas-logo"
        >
        <span class="visitas-brand-text">
          RUTA
        </span>
        <span class="visitas-brand-text">
          Gestión de servicios en campo
        </span>
      </div>

      <div class="visitas-user">
        <img
          src="/avatar.png"
          alt="Usuario administrador"
          class="visitas-avatar"
        >
        <div class="visitas-user-info">
          <strong>Usuario</strong>
          <span>Admin</span>
        </div>
      </div>
    </header>

    <!-- Subheader Volver -->
    <div class="sub-header-bar">
      <a
        href="./modulos.html"
        class="visitas-back"
        aria-label="Volver a la selección de módulos"
      >
        <span aria-hidden="true">←</span>
        Volver
      </a>
    </div>

    <!-- Contenido Principal con padding justo para liberar el FAB sin estirar la vista -->
    <main>
      <h1 class="titulo-pagina">Servicios</h1>

      <!-- Buscador Ovalado -->
      <div class="search-ruta-container">
        <input type="text" id="busqueda-servicio" class="search-ruta-input" aria-label="Buscar servicio" placeholder="🔍 Buscar servicio...">
      </div>

      <!-- Grilla de Tarjetas -->
      <div id="grid-servicios" class="services-grid-ruta">
        <!-- Generadas dinámicamente desde JS -->
      </div>

      <!-- Contenedor de Paginación -->
      <div id="paginacion-servicios" class="paginacion-ruta">
        <!-- Botones de navegación generados por JS -->
      </div>

      <!-- Botón Flotante (+) -->
      <button id="btn-fab-nuevo" class="fab-ruta" title="Crear nuevo servicio" aria-label="Crear nuevo servicio">+</button>

      <!-- Modal Emergente (Crear / Editar) -->
      <div id="modal-servicio" class="modal-overlay-ruta hidden">
        <div class="modal-card-ruta">
          <button id="btn-close-modal" class="modal-close-x" aria-label="Cerrar">&times;</button>
          <h2 id="modal-title" class="modal-title-ruta">Crear nuevo servicio</h2>

          <form id="form-modal-servicio">
            <input type="hidden" id="input-servicio-id">

            <div class="form-group">
              <label for="input-nombre" class="form-label">Servicio:</label>
              <input type="text" id="input-nombre" class="form-input" required placeholder="Ej. Limpieza de Albercas">
            </div>

            <div class="form-group">
              <label for="input-descripcion" class="form-label">Descripción:</label>
              <textarea id="input-descripcion" class="form-input" rows="3" placeholder="Detalles o actividades del servicio..."></textarea>
            </div>

            <div class="form-group">
              <label for="input-tiempo" class="form-label">Tiempo estimado en minutos:</label>
              <div class="input-con-icono">
                <span class="icono-input">🕒</span>
                <input type="number" id="input-tiempo" class="form-input" min="1" step="1" required placeholder="60">
              </div>
            </div>

            <p id="form-error" class="form-error-ruta" role="alert" hidden></p>

            <div class="modal-acciones modal-acciones-fin">
              <button type="submit" class="btn-ruta-confirm">Confirmar</button>
              <button type="button" id="btn-cancelar-modal" class="btn-ruta-cancel">Cancelar</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Modal Confirmar Eliminación -->
      <div id="modal-confirmar-eliminar" class="modal-overlay-ruta hidden">
        <div class="modal-card-ruta modal-card-confirmar">
          <button id="btn-close-modal-eliminar" class="modal-close-x" aria-label="Cerrar">&times;</button>
          <div class="modal-icono-alerta">⚠️</div>
          <h2 class="modal-title-ruta modal-title-peligro">¿Eliminar servicio?</h2>
          <p id="texto-confirmar-eliminar" class="texto-confirmar">
            ¿Estás seguro de que deseas eliminar este servicio? Esta acción no se puede deshacer.
          </p>
          <div class="modal-acciones modal-acciones-centro">
            <button id="btn-confirmar-eliminar" class="btn-ruta-confirm btn-peligro">Sí, eliminar</button>
            <button id="btn-cancelar-eliminar" class="btn-ruta-cancel">Cancelar</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script type="module" src="./servicios.js"></script>
</body>
</html>
