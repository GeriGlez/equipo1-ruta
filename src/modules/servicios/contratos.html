<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUTA · Contratos</title>
  <link rel="stylesheet" href="../../styles/main.css">
  <link rel="stylesheet" href="./contratos.css">
</head>
<body>

  <div id="app">
    <!-- ==================================================
        ENCABEZADO UNIFICADO
    =================================================== -->
    <header class="visitas-header">
      <div class="visitas-brand">
        <img
          src="/logo-ruta.png"
          alt="RUTA"
          class="visitas-logo"
        >
        <span class="visitas-brand-text">
          RUTA
        </span>
        <span class="visitas-brand-text">
          Gestión de servicios en campo
        </span>
      </div>

      <div class="visitas-user">
        <img
          src="/avatar.png"
          alt="Usuario administrador"
          class="visitas-avatar"
        >
        <div class="visitas-user-info">
          <strong>Usuario</strong>
          <span>Admin</span>
        </div>
      </div>
    </header>

    <!-- Subheader Volver -->
    <div class="sub-header-bar">
      <a
        href="./modulos.html"
        class="visitas-back"
        aria-label="Volver a la selección de módulos"
      >
        <span aria-hidden="true">←</span>
        Volver
      </a>
    </div>

    <!-- Contenido Principal -->
    <main>
      <h1 class="titulo-pagina">Contratos</h1>

      <!-- Buscador Ovalado -->
      <div class="search-ruta-container">
        <input type="text" id="busqueda-contrato" class="search-ruta-input" aria-label="Buscar condominio o contrato" placeholder="🔍 Buscar condominio o contrato...">
      </div>

      <!-- Grilla de Tarjetas -->
      <div id="grid-contratos" class="services-grid-ruta">
        <!-- Generadas dinámicamente desde JS -->
      </div>

      <!-- Contenedor de Paginación -->
      <div id="paginacion-contratos" class="paginacion-ruta">
        <!-- Botones generados por JS -->
      </div>

      <!-- Botón Flotante (+) -->
      <button id="btn-fab-nuevo" class="fab-ruta" title="Crear nuevo contrato" aria-label="Crear nuevo contrato">+</button>

      <!-- Modal Emergente (Nuevo / Editar) -->
      <div id="modal-contrato" class="modal-overlay-ruta hidden">
        <div class="modal-card-contrato">
          <button id="btn-close-modal" class="modal-close-x-red" aria-label="Cerrar">&times;</button>
          <h2 id="modal-title" class="modal-title-contrato">Nuevo contrato</h2>

          <form id="form-modal-contrato">
            <input type="hidden" id="input-contrato-id">

            <div class="form-group-contrato">
              <label for="select-condominio" class="label-contrato">Condominio / Residencia:</label>
              <select id="select-condominio" class="input-contrato" required>
                <option value="" disabled selected>Selecciona un condominio...</option>
              </select>
            </div>

            <div class="form-group-contrato">
              <label for="select-servicio" class="label-contrato">Servicio a contratar:</label>
              <select id="select-servicio" class="input-contrato" required>
                <option value="" disabled selected>Selecciona un servicio...</option>
              </select>
            </div>

            <div class="form-group-contrato">
              <label for="input-tarifa" class="label-contrato">Tarifa mensual ($):</label>
              <input type="number" id="input-tarifa" class="input-contrato" min="0.01" step="0.01" required placeholder="2000">
            </div>

            <div class="form-group-contrato">
              <label for="select-frecuencia" class="label-contrato">Frecuencia semanal / mensual:</label>
              <select id="select-frecuencia" class="input-contrato" required>
                <option value="" disabled selected>Selecciona frecuencia...</option>
                <option value="1 día a la semana">1 día a la semana</option>
                <option value="2 días a la semana">2 días a la semana</option>
                <option value="3 días a la semana">3 días a la semana</option>
                <option value="4 días a la semana">4 días a la semana</option>
                <option value="5 días a la semana">5 días a la semana</option>
                <option value="Quincenal">Quincenal</option>
                <option value="Mensual">Mensual</option>
              </select>
            </div>

            <div class="form-group-contrato">
              <label for="input-dias" class="label-contrato">Días de la semana preferenciales:</label>
              <input type="text" id="input-dias" class="input-contrato" required placeholder="Ej. Lunes, Viernes y Sábados">
            </div>

            <p id="form-error" class="form-error-ruta" role="alert" hidden></p>

            <div class="modal-actions-contrato">
              <button type="submit" class="btn-confirmar-green">Confirmar</button>
              <button type="button" id="btn-cancelar-modal" class="btn-cancelar-red">Cancelar</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Modal Confirmar Eliminación -->
      <div id="modal-confirmar-eliminar" class="modal-overlay-ruta hidden">
        <div class="modal-card-ruta modal-card-confirmar">
          <button id="btn-close-modal-eliminar" class="modal-close-x" aria-label="Cerrar">&times;</button>
          <div class="modal-icono-alerta">⚠️</div>
          <h2 class="modal-title-ruta modal-title-peligro">¿Eliminar contrato?</h2>
          <p id="texto-confirmar-eliminar" class="texto-confirmar">
            ¿Estás seguro de que deseas eliminar este contrato? Esta acción no se puede deshacer.
          </p>
          <div class="modal-acciones modal-acciones-centro">
            <button id="btn-confirmar-eliminar" class="btn-ruta-confirm btn-peligro">Sí, eliminar</button>
            <button id="btn-cancelar-eliminar" class="btn-ruta-cancel">Cancelar</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script type="module" src="./contratos.js"></script>
</body>
</html>
