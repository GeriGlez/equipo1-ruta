<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUTA | Condominios y áreas</title>

  <link rel="stylesheet" href="../../styles/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/adminapp.css">
  <link rel="stylesheet" href="./condominios.css">
</head>
<body>

  <!-- Encabezado estándar, igual al de home (estilos en adminapp.css) -->
  <header class="admin-header">
    <div class="admin-brand">
      <div class="admin-brand-main">
        <img src="/logo-ruta.png" class="admin-logo" alt="">
        <span class="admin-brand-name">RUTA</span>
      </div>
      <span class="admin-brand-subtitle">Gestión de servicios en campo</span>
    </div>
    <div class="admin-user" style="cursor: default">
      <img src="/avatar.png" class="admin-avatar" alt="">
      <strong id="nombre-usuario">Usuario</strong>
      <span>Administrador</span>
    </div>
  </header>

  <nav class="condo-subbar">
    <a href="/" class="condo-back">← Volver</a>
  </nav>

  <main class="condo-main">
    <h1 class="condo-title">Administra los desarrollos residenciales, sus áreas y notas de acceso</h1>

    <!-- Filtros -->
    <section class="condo-filtros">
      <div class="condo-buscador">
        <span class="condo-buscador-icono" aria-hidden="true">⌕</span>
        <input
          id="buscar"
          type="search"
          class="form-input"
          placeholder="Buscar por nombre, colonia o contacto..."
          aria-label="Buscar condominio"
        >
      </div>

      <div class="condo-filtro">
        <label for="filtro-tipo" class="form-label">Tipo de área:</label>
        <select id="filtro-tipo" class="form-input">
          <option value="">Todas</option>
          <!-- Las opciones de tipo las llena condominios.js con TIPOS_AREA -->
        </select>
      </div>

      <div class="condo-filtro">
        <label for="filtro-estado" class="form-label">Estado:</label>
        <select id="filtro-estado" class="form-input">
          <option value="activos">Activos</option>
          <option value="inactivos">Inactivos</option>
          <option value="todos">Todos</option>
        </select>
      </div>
    </section>

    <!-- Tabla -->
    <div class="condo-tabla-wrap">
      <table class="condo-tabla">
        <thead>
          <tr>
            <th>Condominio</th>
            <th>Colonia / Dir.</th>
            <th>Áreas registradas</th>
            <th>Contacto / Tel</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-body">
          <tr><td colspan="6" class="condo-vacio">Cargando condominios...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Paginación -->
    <footer class="condo-paginacion">
      <span id="texto-mostrando"></span>
      <div class="condo-paginas" id="paginas"></div>
    </footer>

    <p id="mensaje" class="condo-mensaje" role="alert" hidden></p>

    <div class="condo-acciones-pie">
      <a href="./registrar-condominio.html" class="btn condo-btn-registrar">+ Registrar condominio</a>
    </div>
    <!-- Confirmación para activar / desactivar un condominio -->
    <dialog id="dialogo-estado" class="condo-dialogo" aria-labelledby="dialogo-titulo" aria-describedby="dialogo-texto">
      <form method="dialog">
        <h2 id="dialogo-titulo" class="condo-dialogo-titulo"></h2>
        <p id="dialogo-texto" class="condo-dialogo-texto"></p>
        <div class="condo-dialogo-botones">
          <button type="submit" value="cancelar" class="btn condo-dialogo-cancelar" autofocus>Cancelar</button>
          <button type="submit" value="confirmar" id="dialogo-confirmar" class="btn condo-dialogo-confirmar"></button>
        </div>
      </form>
    </dialog>
  </main>

  <script type="module" src="./condominios.js"></script>
</body>
</html>
