<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUTA | Condominios y áreas</title>

  <link rel="stylesheet" href="../../styles/main.css">
  <link rel="stylesheet" href="./condominios.css">
</head>
<body>

  <header class="condo-header">
    <div class="condo-brand">
      <img src="/logo-ruta.png" alt="" class="condo-logo">
      <div>
        <strong class="condo-brand-name">RUTA</strong>
        <span class="condo-brand-sub">Gestión de servicios en campo</span>
      </div>
    </div>

    <div class="condo-user">
      <img src="/avatar.png" alt="" class="condo-avatar">
      <div class="condo-user-info">
        <strong id="nombre-usuario">Usuario</strong>
        <span>Administrador</span>
      </div>
    </div>
  </header>

  <nav class="condo-subbar">
    <a href="/" class="condo-back">← Volver</a>
  </nav>

  <main class="condo-main">
    <h1 class="condo-title">Administra los desarrollos residenciales, sus áreas y notas de acceso</h1>

    <!-- Filtros -->
    <section class="condo-filtros">
      <div class="condo-buscador">
        <span class="condo-buscador-icono" aria-hidden="true">⌕</span>
        <input
          id="buscar"
          type="search"
          class="form-input"
          placeholder="Buscar por nombre, colonia o contacto..."
          aria-label="Buscar condominio"
        >
      </div>

      <div class="condo-filtro">
        <label for="filtro-tipo" class="form-label">Tipo de área:</label>
        <select id="filtro-tipo" class="form-input">
          <option value="">Todas</option>
          <!-- Las opciones de tipo las llena condominios.js con TIPOS_AREA -->
        </select>
      </div>

      <div class="condo-filtro">
        <label for="filtro-estado" class="form-label">Estado:</label>
        <select id="filtro-estado" class="form-input">
          <option value="activos">Activos</option>
          <option value="inactivos">Inactivos</option>
          <option value="todos">Todos</option>
        </select>
      </div>
    </section>

    <!-- Tabla -->
    <div class="condo-tabla-wrap">
      <table class="condo-tabla">
        <thead>
          <tr>
            <th>Condominio</th>
            <th>Colonia / Dir.</th>
            <th>Áreas registradas</th>
            <th>Contacto / Tel</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-body">
          <tr><td colspan="6" class="condo-vacio">Cargando condominios...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Paginación -->
    <footer class="condo-paginacion">
      <span id="texto-mostrando"></span>
      <div class="condo-paginas" id="paginas"></div>
    </footer>

    <p id="mensaje" class="condo-mensaje" role="alert" hidden></p>

    <div class="condo-acciones-pie">
      <a href="./registrar-condominio.html" class="btn condo-btn-registrar">+ Registrar condominio</a>
    </div>
  </main>

  <script type="module" src="./condominios.js"></script>
</body>
</html>
